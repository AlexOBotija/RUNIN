# Packaging info only. The libraries we depend on are listed in requirements.txt.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "running-coach-crew"
version = "0.1.0"
description = "Ask questions about your running in plain English; a crew of AI agents answers like a coach."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
